<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Reel creador — Tech&amp;Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800..900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<link rel="stylesheet" href="identidad.css">
<link rel="stylesheet" href="logo.css">
<link rel="stylesheet" href="piezas.css">
<!--
  Reel estilo creador (1080×1920, 10 s): subtítulos que entran palabra por palabra sobre un video de PERSONAS REALES
  (montajes de armar_pixabay.sh). La página es transparente: se graba encima del video con --fondo.
  El hook está entero desde el cuadro 0. Texto dentro de la zona segura (250–1300 px).
    node exportar_video.js plantillas/creador.html "r=cual" salida/x.mp4 --fondo videos/clips/pixabay/cual_vertical.mp4
  ?ver=1 muestra el video en el navegador (para revisar).
-->
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  body { width: 1080px; height: 1920px; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .sombra { position: absolute; left: 0; right: 0; top: 700px; height: 760px;
            background: radial-gradient(ellipse 80% 50% at 50% 50%, rgba(10,10,11,.5), rgba(10,10,11,0)); }
  .arriba { position: absolute; left: 0; right: 0; top: 0; height: 420px; background: linear-gradient(rgba(10,10,11,.45), rgba(10,10,11,0)); }
  .sub { position: absolute; left: 60px; right: 60px; top: 1080px; translate: 0 -50%; text-align: center; color: var(--hueso);
         font-size: 168px; line-height: .92; text-shadow: 0 0 2px rgba(0,0,0,.9), 0 6px 0 rgba(0,0,0,.35), 0 10px 40px rgba(0,0,0,.6); }
  .sub.hook { font-size: 150px; }
  .sub span { display: inline-block; }
  .sub b { color: var(--lima); font-weight: inherit; }
  .chico { position: absolute; left: 0; right: 0; top: 1290px; text-align: center; color: var(--hueso); font-size: 40px;
           text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  .chico b { color: var(--lima); }
  .logo { position: absolute; left: 50%; translate: -50% 0; top: 250px; font-size: var(--logo); color: var(--hueso); z-index: 5; }
  /* corte de equipo: foto oficial sobre un color de la marca (tapa el video) */
  .panel { position: absolute; inset: 0; overflow: hidden; }
  .panel.tinta { background: radial-gradient(ellipse 70% 45% at 50% 38%, #26262b, var(--tinta)); }
  .panel.voltio { background: radial-gradient(ellipse 70% 45% at 50% 38%, #a891ff, var(--voltio)); }
  .panel img { position: absolute; top: 690px; left: 50%; height: 660px; translate: -50% -50%; filter: drop-shadow(0 40px 50px rgba(0,0,0,.45)); }
  .panel.par img { height: 560px; }
  .panel .nom { position: absolute; top: 960px; width: 460px; translate: -50% 0; text-align: center; color: var(--hueso); font-size: 32px; }
  .panel .dato { position: absolute; top: 1110px; width: 500px; translate: -50% 0; text-align: center; color: var(--hueso); font-size: 150px; line-height: .92; }
  .panel .dato.gana { color: var(--lima); }
  .panel.voltio .dato.gana { color: var(--tinta); }
  .panel .etq { position: absolute; left: 0; right: 0; top: 1290px; text-align: center; color: var(--hueso); font-size: 40px; opacity: .85; }
  .sub.en-panel { top: 1180px; text-shadow: none; }
  .sub.en-voltio b { color: var(--tinta); }
</style>
</head>
<body>
<div class="arriba"></div>
<div class="sombra"></div>
<div id="subs"></div>
<span class="logo-tc logo">Tech<b>&amp;</b>Co<i></i></span>
<script>
// [desde (s), hasta (s), texto (las palabras entre * van en lima; | = salto de línea; ^ = sin mayúsculas forzadas), texto chico (opcional), equipo (opcional)]
// equipo: { foto, fondo: "tinta"|"voltio" } → la foto oficial (catalogo/img) tapa el video en ese corte
//         { fotos: [a, b], nombres: [a, b], datos: [a, b], gana: 0|1, centro, etiqueta } → comparación lado a lado
// dur: duración del reel en s (10 por defecto)
// los tiempos siguen los cortes de armar_pixabay.sh
const GUIONES = {
  // (2026-10-30) Sin el ángulo «pagás menos»: también se venden nuevos en caja sellada. Ejes: te asesoramos, a pedido, regalo.
  "cual": { fondo: "../videos/clips/pixabay/cual_vertical.mp4", lineas: [
    [0, 2.4, "¿No sabés|qué celu|*comprarte?*"],
    [2.4, 3.8, "¿Sacás|*fotos?*"],
    [3.8, 5.0, "¿*Jugás?*"],
    [5.0, 6.2, "¿Vivís en|*las redes?*"],
    [6.2, 8.0, "Te decimos|*cuál va|con vos.*"],
    [8.0, 10, "Y te lo|*conseguimos.*", "Contanos qué usás · <b>escribinos</b>"],
  ] },
  "conseguimos": { fondo: "../videos/clips/pixabay/conseguimos_vertical.mp4", lineas: [
    [0, 2.4, "¿No encontrás|el celu|*que querés?*"],
    [2.4, 4.0, "¿Ya lo|buscaste|*por todos lados?*"],
    [4.0, 5.6, "*Escribinos.*"],
    [5.6, 7.2, "Te lo|*conseguimos.*"],
    [7.2, 8.8, "Y te llega|*a tu casa.*"],
    [8.8, 10, "¿Cuál|*buscás?*", "<b>Envíos a todo el país</b>"],
  ] },
  "navidad": { fondo: "../videos/clips/pixabay/navidad-px_vertical.mp4", lineas: [
    [0, 2.4, "¿Ya sabés|qué regalar|*esta Navidad?*"],
    [2.4, 4.4, "Un celu|*nunca falla.*"],
    [4.4, 6.0, "Para tus|*viejos.*"],
    [6.0, 7.6, "Nuevo,|*en caja|sellada.*"],
    [7.6, 10, "Pedilo|*con tiempo.*", "Escribinos · <b>te lo conseguimos</b>"],
  ] },
  // (2026-10-30) Samsung y Xiaomi: nuevos en caja sellada. Fotos oficiales de catalogo/img; clips de personas con Android.
  "samsung": { dur: 11, fondo: "../videos/clips/pixabay/samsung_vertical.mp4", lineas: [
    [0, 2.2, "¿Sos de|*Samsung?*"],
    [2.2, 3.0, "Galaxy|*A17*", "", { foto: "galaxy-a17", fondo: "tinta" }],
    [3.0, 3.8, "Galaxy|*A36*", "", { foto: "galaxy-a36", fondo: "voltio" }],
    [3.8, 4.6, "Galaxy|*A56*", "", { foto: "galaxy-a56", fondo: "tinta" }],
    [4.6, 5.6, "Galaxy|*S25 Ultra*", "", { foto: "galaxy-s25-ultra", fondo: "voltio" }],
    [5.6, 7.4, "Nuevos,|*en caja|sellada.*"],
    [7.4, 9.2, "Para vos|*o para|regalar.*"],
    [9.2, 11, "¿Cuál|*querés?*", "Escribinos · <b>te lo conseguimos</b>"],
  ] },
  "xiaomi": { dur: 11, fondo: "../videos/clips/pixabay/xiaomi_vertical.mp4", lineas: [
    [0, 2.2, "¿Team|*Xiaomi?*"],
    [2.2, 2.86, "Redmi|*13C*", "", { foto: "redmi-13c", fondo: "tinta" }],
    [2.86, 3.52, "Redmi|*Note 14*", "", { foto: "redmi-note-14", fondo: "voltio" }],
    [3.52, 4.18, "Redmi|*Note 15 Pro*", "", { foto: "redmi-note-15-pro", fondo: "tinta" }],
    [4.18, 4.84, "Redmi|*Note 17 Pro*", "", { foto: "redmi-note-17-pro-5g", fondo: "voltio" }],
    [4.84, 5.5, "Xiaomi|*15T*", "", { foto: "xiaomi-15t", fondo: "tinta" }],
    [5.5, 6.2, "POCO|*F7*", "", { foto: "poco-f7", fondo: "voltio" }],
    [6.2, 8.0, "Nuevos,|*en caja|sellada.*"],
    [8.0, 9.4, "Redmi, POCO|*y Xiaomi.*"],
    [9.4, 11, "¿Cuál|*querés?*", "Escribinos · <b>te lo conseguimos</b>"],
  ] },
  // specs verificadas en fichas oficiales (ver plantillas/comparar.js)
  "samsung-o-xiaomi": { dur: 12, fondo: "../videos/clips/pixabay/samsung-o-xiaomi_vertical.mp4", lineas: [
    [0, 2.2, "¿Samsung|*o Xiaomi?*"],
    [2.2, 3.8, "", "", { fotos: ["galaxy-a36", "redmi-note-15-pro"], nombres: ["Galaxy A36 5G", "Redmi Note 15 Pro"], datos: ["", ""], centro: "VS", etiqueta: "Los dos nuevos, en caja sellada" }],
    [3.8, 5.6, "", "", { fotos: ["galaxy-a36", "redmi-note-15-pro"], nombres: ["Galaxy A36 5G", "Redmi Note 15 Pro"], datos: ["50 MP", "200 MP"], gana: 1, etiqueta: "Cámara principal" }],
    [5.6, 7.4, "", "", { fotos: ["galaxy-a36", "redmi-note-15-pro"], nombres: ["Galaxy A36 5G", "Redmi Note 15 Pro"], datos: ["5000", "6500"], gana: 1, etiqueta: "Batería (mAh)" }],
    [7.4, 9.2, "", "", { fotos: ["galaxy-a36", "redmi-note-15-pro"], nombres: ["Galaxy A36 5G", "Redmi Note 15 Pro"], datos: ["256 GB", "256 GB"], etiqueta: "Capacidad" }],
    [9.2, 12, "¿Cuál te|*llevás?*", "Comentá <b>S o X</b> 👇"],
  ] },
  // (2026-10-30) Más Samsung/Xiaomi. El usuario NO quiere cierres con «¿cuál querés/elegís?»: el eje es «¿Team Android? Esto es para vos».
  "team-android": { dur: 11, fondo: "../videos/clips/pixabay/team-android_vertical.mp4", lineas: [
    [0, 2.4, "¿Team Android?|*Esto es|para vos.*"],
    [2.4, 3.0, "Galaxy|*S25 Ultra*", "", { foto: "galaxy-s25-ultra", fondo: "tinta" }],
    [3.0, 3.6, "Xiaomi|*15T*", "", { foto: "xiaomi-15t", fondo: "voltio" }],
    [3.6, 4.2, "Galaxy|*A56*", "", { foto: "galaxy-a56", fondo: "tinta" }],
    [4.2, 4.8, "POCO|*F7*", "", { foto: "poco-f7", fondo: "voltio" }],
    [4.8, 5.4, "Redmi|*Note 15 Pro*", "", { foto: "redmi-note-15-pro", fondo: "tinta" }],
    [5.4, 6.0, "Galaxy|*A36*", "", { foto: "galaxy-a36", fondo: "voltio" }],
    [6.0, 7.6, "Samsung|*y Xiaomi.*"],
    [7.6, 9.2, "Nuevos,|*en caja|sellada.*"],
    [9.2, 11, "Escribinos.|*Te lo|conseguimos.*", "<b>Envíos a todo el país</b>"],
  ] },
  "ya-no-da": { dur: 11, fondo: "../videos/clips/pixabay/ya-no-da_vertical.mp4", lineas: [
    [0, 2.2, "¿Tu celu|ya no|*da más?*"],
    [2.2, 3.2, "*Esto es|para vos.*"],
    [3.2, 3.9, "Galaxy|*A17*", "", { foto: "galaxy-a17", fondo: "tinta" }],
    [3.9, 4.6, "Redmi|*Note 14*", "", { foto: "redmi-note-14", fondo: "voltio" }],
    [4.6, 5.3, "Galaxy|*A56*", "", { foto: "galaxy-a56", fondo: "tinta" }],
    [5.3, 6.0, "Xiaomi|*15T*", "", { foto: "xiaomi-15t", fondo: "voltio" }],
    [6.0, 7.6, "Nuevos,|*en caja|sellada.*"],
    [7.6, 9.2, "Te llega|*a tu casa.*"],
    [9.2, 11, "Escribinos.|*Te lo|conseguimos.*", "<b>Envíos a todo el país</b>"],
  ] },
  // batería: datos de fichas oficiales (ver plantillas/comparar.js)
  "bateria-android": { dur: 12, fondo: "../videos/clips/pixabay/bateria-android_vertical.mp4", lineas: [
    [0, 2.4, "¿Tu batería|no llega|*a la noche?*"],
    [2.4, 3.4, "*Esto es|para vos.*"],
    [3.4, 5.4, "6500 *^mAh*", "Redmi Note 15 Pro · batería", { foto: "redmi-note-15-pro", fondo: "tinta" }],
    [5.4, 7.4, "5000 *^mAh*", "Galaxy A36 5G · batería", { foto: "galaxy-a36", fondo: "voltio" }],
    [7.4, 9.4, "Nuevos,|*en caja|sellada.*"],
    [9.4, 12, "Escribinos.|*Te lo|conseguimos.*", "<b>Envíos a todo el país</b>"],
  ] },
};
const P = new URLSearchParams(location.search);
const G = GUIONES[P.get("r") || "cual"];
const T = (G.dur || 10) * 1000;
const $ = (s) => document.getElementById(s);
if (P.has("ver")) { const v = document.createElement("video"); v.src = G.fondo; v.muted = v.loop = v.autoplay = true; document.body.prepend(v); }

const ANIMS = [];
const anim = (el, fr) => {
  const k = fr.map(([ms, p, e]) => ({ ...p, offset: Math.min(1, Math.max(0, ms / T)), easing: e || "linear" }));
  if (k[0].offset > 0) k.unshift({ ...k[0], offset: 0 });
  if (k[k.length - 1].offset < 1) k.push({ ...k[k.length - 1], offset: 1 });
  ANIMS.push(el.animate(k, { duration: T, fill: "both" }));
};
const pop = "cubic-bezier(.2,1.6,.4,1)";

const visible = (el, ini, fin) => anim(el, [[ini - 1, { visibility: "hidden" }], [ini, { visibility: "visible" }], [fin - 1, { visibility: "visible" }], [fin, { visibility: "hidden" }]]);
const fotos = [];
G.lineas.forEach(([a, b, txt, chico, eq], i) => {
  const ini = a * 1000, fin = b * 1000;
  if (eq) {
    const p = document.createElement("div");
    const par = Boolean(eq.fotos);
    p.className = "panel " + (eq.fondo || (i % 2 ? "tinta" : "voltio")) + (par ? " par" : "");
    const fs = par ? eq.fotos : [eq.foto];
    p.innerHTML = fs.map((f, k) => {
      const x = par ? (k ? 790 : 290) : 540;
      return `<img src="../catalogo/img/${f}.webp" alt="" style="left:${x}px">`
        + (par ? `<div class="mono nom" style="left:${x}px">${eq.nombres[k]}</div><div class="titular dato${eq.gana === k ? " gana" : ""}" style="left:${x}px">${eq.datos[k]}</div>` : "");
    }).join("") + (eq.centro ? `<div class="titular dato gana" style="left:540px; top:560px; width:200px">${eq.centro}</div>` : "") + (eq.etiqueta ? `<div class="mono etq">${eq.etiqueta}</div>` : "");
    $("subs").appendChild(p);
    visible(p, ini, fin);
    p.querySelectorAll("img").forEach((im, k) => {
      fotos.push(im);
      anim(im, [[ini + k * 80, { transform: "scale(.82) translateY(60px)", opacity: 0 }, pop], [ini + k * 80 + 260, { transform: "scale(1)", opacity: 1 }], [fin, { transform: "scale(1.06)", opacity: 1 }]]);
    });
    p.querySelectorAll(".dato").forEach((dt, k) => anim(dt, [[ini + 200 + k * 120, { transform: "scale(.6)", opacity: 0 }, pop], [ini + 420 + k * 120, { transform: "scale(1)", opacity: 1 }]]));
  }
  if (!txt) return;
  const d = document.createElement("div");
  d.className = "titular sub" + (i ? "" : " hook") + (eq ? " en-panel" : "") + (eq && eq.fondo === "voltio" ? " en-voltio" : "");
  // palabras: *x* = lima, | = salto de línea
  let lima = false;
  d.innerHTML = txt.split("|").map((ln) => ln.split(" ").map((w) => {
    const ab = w.startsWith("*"), ce = w.endsWith("*");
    if (ab) lima = true;
    const caja = w.includes("^") ? ' style="text-transform: none"' : "";   // ^ = respeta mayúsculas/minúsculas (mAh)
    const html = `<span${caja}>${lima ? "<b>" : ""}${w.replace(/[*^]/g, "")}${lima ? "</b>" : ""}</span>`;
    if (ce) lima = false;
    return html;
  }).join(" ")).join("<br>");
  $("subs").appendChild(d);
  visible(d, ini, fin);
  // el hook está entero en el cuadro 0; el resto entra palabra por palabra
  [...d.querySelectorAll("span")].forEach((s, k) => {
    const t = i ? ini + k * 110 : 0;
    anim(s, [[t, { opacity: i ? 0 : 1, transform: i ? "scale(.6) translateY(30px)" : "scale(1)" }, pop], [t + 220, { opacity: 1, transform: "scale(1)" }]]);
  });
  if (chico) {
    const c = document.createElement("div");
    c.className = "mono chico";
    c.innerHTML = chico;
    if (txt.split("|").length > 2 && !eq) c.style.top = "1360px";   // con 3 renglones, el texto chico baja
    $("subs").appendChild(c);
    visible(c, ini, fin);
    anim(c, [[ini + 450, { opacity: 0, transform: "translateY(20px)" }, pop], [ini + 750, { opacity: 1, transform: "none" }], [fin, { opacity: 1 }]]);
  }
});

window.PLANTILLA = {
  duracion: T,
  async listo() { await document.fonts.ready; await Promise.all(fotos.map((f) => f.decode())); },
  ir(ms) { ANIMS.forEach((a) => { a.pause(); a.currentTime = ms; }); },
};
</script>
</body>
</html>
